<div class="chat-label label-stripe-chat">{{localize 'SFTD.CutLooseRoll'}}</div>

<div class="leader-block">
  <label><b>{{localize 'SFTD.Leader'}}</b></label>
  <div class="flex-horizontal">
    <img src="{{leader.img}}" data-tooltip="{{leader.name}}" width="48" height="48"/>
    <div class="name">{{leader.name}}</div>
  </div>
</div>

<div class="leader-block">
  <label><b>{{localize 'SFTD.Participants'}}</b></label>
  {{#each participants as |participant id|}}
  <div class="flex-horizontal">
    <img src="{{participant.img}}" data-tooltip="{{participant.name}}" width="24" height="24"/>
    <div class="name">{{participant.name}}</div>
  </div>
  {{/each}}
</div>

<div class="button">
  <button class="roll-cut-loose">{{localize 'SFTD.RollCutLooseButton'}}</button>
</div>

<div class="button gm-only">
  <button class="reveal-cut-loose-result">{{localize 'SFTD.RevealCutLooseResult'}}</button>
</div>

{{#if note}}
  <p><em>{{note}}</em></p>
{{/if}}
