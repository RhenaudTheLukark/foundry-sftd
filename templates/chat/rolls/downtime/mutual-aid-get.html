<div class="dice-tooltip blades-die-tooltip">
  <div class="chat-label label-stripe-chat">{{localize 'SFTD.MutualAidRoll'}}</div>

  <div class="description">
    <p>{{{localize 'SFTD.RollMutualAid' faction=faction.name statusText=statusText status=status shells=shells}}}</p>
  </div>

  {{#if extraFields.modifier_text}}
  <div class="description">
    <p>{{{extraFields.modifier_text}}}</p>
  </div>
  {{/if}}

  {{#if note}}
    <em>{{note}}</em>
  {{/if}}
</div>
